<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#15182f"
  >

  <title>YURIA | Portfolio</title>

  <link
    rel="preload"
    href="./assets/images/entrance-bg.png"
    as="image"
  >

  <link
    rel="stylesheet"
    href="./css/entrance.css"
  >
</head>

<body>

  <div id="vrBlackout"></div>

  <main id="entrance">

    <section class="hero">

      <div class="entrance-copy">

        <p class="welcome">
          WELCOME TO
        </p>

        <h1>
          MY
          <span>WORLD</span>
        </h1>

        <p class="description">
          Step into my portfolio.
        </p>

      </div>

      <div
        id="vrCanvas"
        tabindex="0"
        role="button"
        aria-label="Enter my VR world"
      ></div>

      <p class="hint">
        click the headset to enter ♡
      </p>

    </section>

  </main>


  <script type="importmap">
  {
    "imports": {
      "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

      "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script
    type="module"
    src="./js/vr.js"
  ></script>

</body>

</html>
