<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>MY | Portfolio</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- =====================================
       VR装着時の暗転
  ====================================== -->

  <div id="vrBlackout"></div>


  <!-- =====================================
       ENTRANCE
  ====================================== -->

  <main id="entrance">

    <!-- 背景の光 -->

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>


    <!-- 星 -->

    <div class="stars">

      <span>✦</span>
      <span>✧</span>
      <span>⋆</span>
      <span>✦</span>
      <span>♡</span>

    </div>


    <!-- メイン -->

    <section class="hero">

      <p class="welcome">
        WELCOME TO
      </p>


      <h1>
        MY
        <span>WORLD</span>
      </h1>


      <p class="description">
        Step into my portfolio.
      </p>


      <!-- Three.js -->

      <div
        id="vrCanvas"
        tabindex="0"
        role="button"
        aria-label="Enter my VR world"
      ></div>


      <p class="hint">
        click the headset to enter ♡
      </p>

    </section>

  </main>


  <!-- =====================================
       VR WORLD
  ====================================== -->

  <section id="world">

    <div class="world-title">

      <p>
        YURIA'S SPACE
      </p>

      <h2>
        What would you like to know?
      </h2>

    </div>


    <div class="apps">

      <button class="app">

        <div class="app-icon">
          ♡
        </div>

        <p>PROFILE</p>

      </button>


      <button class="app">

        <div class="app-icon">
          &lt;/&gt;
        </div>

        <p>SKILLS</p>

      </button>


      <button class="app">

        <div class="app-icon">
          ✦
        </div>

        <p>WORKS</p>

      </button>


      <button class="app">

        <div class="app-icon">
          ♬
        </div>

        <p>HOBBY</p>

      </button>


      <button class="app">

        <div class="app-icon">
          ♟
        </div>

        <p>GAMES</p>

      </button>

    </div>

    <!-- =====================================
         PIXEL CAT
    ====================================== -->

    <div
      id="pixelCat"
      class="pixel-cat"
      role="button"
      tabindex="0"
      aria-label="Pet the cat"
    >

      <div class="cat-hearts"></div>

      <div class="cat-sprite">
        <div class="cat-tail"></div>

        <div class="cat-body">
          <div class="cat-head">

            <span class="cat-ear cat-ear-left"></span>
            <span class="cat-ear cat-ear-right"></span>

            <span class="cat-eye cat-eye-left"></span>
            <span class="cat-eye cat-eye-right"></span>

          </div>

          <span class="cat-leg cat-leg-1"></span>
          <span class="cat-leg cat-leg-2"></span>
          <span class="cat-leg cat-leg-3"></span>
          <span class="cat-leg cat-leg-4"></span>
        </div>
      </div>

    </div>

  </section>

  <!-- =====================================
       THREE.JS IMPORT MAP
  ====================================== -->

  <script type="importmap">
  {
    "imports": {
      "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

      "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>


  <!-- =====================================
       JAVASCRIPT
  ====================================== -->

  <script src="./js/main.js"></script>

  <script
    type="module"
    src="./js/vr.js"
  ></script>

</body>

</html>
