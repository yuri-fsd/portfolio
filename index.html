<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MY | Portfolio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- VR装着時の光 -->
    <div id="vrFlash"></div>
  <main id="entrance">

    <!-- 背景の光 -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <!-- 星 -->
    <div class="stars">
      <span>✦</span>
      <span>✧</span>
      <span>⋆</span>
      <span>✦</span>
      <span>♡</span>
    </div>

    <!-- メイン -->
    <section class="hero">

      <p class="welcome">WELCOME TO</p>

      <h1>
        MY
        <span>WORLD</span>
      </h1>

      <p class="description">
        Step into my portfolio.
      </p>


      <!-- VRゴーグル -->
      <div class="vr-wrapper" id="vrHeadset">

        <div class="vr-headset">

          <div class="vr-body">

            <div class="lens lens-left"></div>
            <div class="lens lens-right"></div>

            <div class="vr-light"></div>

          </div>

          <div class="strap"></div>

        </div>

        <div class="shadow"></div>

      </div>
     

      <p class="hint">
        click the headset to enter ♡
      </p>

    </section>

  </main>


  <!-- VR世界 -->
  <section id="world">

    <div class="world-title">
      <p>YURIA'S SPACE</p>
      <h2>What would you like to know?</h2>
    </div>


    <div class="apps">

      <button class="app">
        <div class="app-icon">♡</div>
        <p>PROFILE</p>
      </button>

      <button class="app">
        <div class="app-icon">&lt;/&gt;</div>
        <p>SKILLS</p>
      </button>

      <button class="app">
        <div class="app-icon">✦</div>
        <p>WORKS</p>
      </button>

      <button class="app">
        <div class="app-icon">♬</div>
        <p>HOBBY</p>
      </button>

      <button class="app">
        <div class="app-icon">♟</div>
        <p>GAMES</p>
      </button>

    </div>

  </section>


  <script src="./js/main.js"></script>

</body>
</html>
